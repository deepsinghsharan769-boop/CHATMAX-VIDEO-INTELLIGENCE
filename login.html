<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHATMAX — Private Login</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:grid;place-items:center;
 background:radial-gradient(circle at top,#38216b,#080812 65%);
 font-family:Arial;color:white;padding:20px
}
.card{
 width:100%;max-width:410px;padding:35px;
 background:#171729;border:1px solid #ffffff25;border-radius:20px
}
.logo{text-align:center;font-size:27px;font-weight:900;letter-spacing:2px}
.logo span{color:#9876ff}
h2{text-align:center;margin-top:30px}
p{text-align:center;color:#aaa;font-size:13px}
label{display:block;margin:20px 0 8px;font-size:13px}
input{
 width:100%;padding:14px;border-radius:9px;
 background:#0b0b17;border:1px solid #444;color:white
}
button{
 width:100%;padding:14px;margin-top:25px;border:0;
 border-radius:9px;background:linear-gradient(100deg,#805aff,#438dff);
 color:white;font-weight:bold;cursor:pointer
}
button:disabled{opacity:.6}
#message{margin-top:15px;text-align:center;font-size:13px}
</style>
</head>

<body>
<div class="card">
 <div class="logo">CHAT<span>MAX</span></div>
 <h2>Private Access</h2>
 <p>Sign in to your Video Intelligence Studio</p>

 <form id="login">
  <label>Username</label>
  <input id="username" type="text" required
  placeholder="Your username" autocomplete="username">

  <label>Password</label>
  <input id="password" type="password" required
  placeholder="Your password" autocomplete="current-password">

  <button id="btn" type="submit">Enter CHATMAX</button>
  <div id="message"></div>
 </form>
</div>

<script>
const form=document.getElementById("login");
const msg=document.getElementById("message");
const btn=document.getElementById("btn");

form.addEventListener("submit",async(e)=>{
 e.preventDefault();

 btn.disabled=true;
 msg.style.color="#aaa";
 msg.textContent="Verifying access...";

 try{
  const response=await fetch("/api/login",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    username:document.getElementById("username").value.trim(),
    password:document.getElementById("password").value
   })
  });

  const data=await response.json();

  if(!response.ok){
   throw new Error(data.error || "Login failed");
  }

  msg.style.color="#75e6a5";
  msg.textContent="Access granted!";

  window.location.href="/";

 }catch(error){
  msg.style.color="#ff7777";
  msg.textContent=error.message;
 }finally{
  btn.disabled=false;
 }
});
</script>
</body>
</html>
