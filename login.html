<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHATMAX — Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#38216b,#080812 65%);font-family:Arial;color:white;padding:20px}
.card{width:100%;max-width:410px;padding:35px;background:#171729;border:1px solid #ffffff25;border-radius:20px}
.logo{text-align:center;font-size:27px;font-weight:900;letter-spacing:2px}
.logo span{color:#9876ff}
h2{text-align:center;margin-top:30px}
p{text-align:center;color:#aaa;font-size:13px}
label{display:block;margin:20px 0 8px;font-size:13px}
input{width:100%;padding:14px;border-radius:9px;background:#0b0b17;border:1px solid #444;color:white}
button{width:100%;padding:14px;margin-top:25px;border:0;border-radius:9px;background:linear-gradient(100deg,#805aff,#438dff);color:white;font-weight:bold;cursor:pointer}
#message{margin-top:15px;text-align:center;font-size:13px}
</style>
</head>
<body>
<div class="card">
<div class="logo">CHAT<span>MAX</span></div>
<h2>Welcome Back</h2>
<p>Sign in to your Video Intelligence Studio</p>

<form id="login">
<label>Email Address</label>
<input id="email" type="email" required placeholder="Your email">

<label>Password</label>
<input id="password" type="password" required placeholder="Your password">

<button id="btn">Sign In</button>
<div id="message"></div>
</form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseClient = window.supabase.createClient(
"https://clhsubfpymlbfasivsgc.supabase.co",
"sb_publishable_6qZPcZUtHeCX1IEHTRlAOQ_mHg3AslU"
);

document.getElementById("login").addEventListener("submit",async(e)=>{
e.preventDefault();
const msg=document.getElementById("message");
const btn=document.getElementById("btn");
btn.disabled=true;
msg.textContent="Signing in...";

const {error}=await supabaseClient.auth.signInWithPassword({
email:document.getElementById("email").value.trim(),
password:document.getElementById("password").value
});

if(error){
msg.textContent=error.message;
}else{
msg.textContent="Login successful!";
msg.style.color="#75e6a5";
}
btn.disabled=false;
});
</script>
</body>
</html>
